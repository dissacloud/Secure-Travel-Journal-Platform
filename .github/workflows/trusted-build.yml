---
name: Trusted Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "application/**"
      - ".github/workflows/trusted-build.yml"
      - "infrastructure/bootstrap/trusted-build/**"

permissions:
  contents: read

concurrency:
  group: trusted-build-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_VERSION: "0.74.0"
  SYFT_VERSION: "v1.50.0"

jobs:
  publish-image:
    name: Trusted Image — ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write
      attestations: write

    strategy:
      fail-fast: false

      matrix:
        include:
          - component: Backend
            component_id: backend
            context: application/backend
            dockerfile: application/backend/Dockerfile

          - component: Frontend
            component_id: frontend
            context: application/frontend
            dockerfile: application/frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_TRUSTED_BUILD_ROLE_ARN }}
          role-session-name: stjp-build-${{ github.run_id }}-${{ matrix.component_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Define immutable build metadata
        id: metadata
        shell: bash
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          COMPONENT_ID: ${{ matrix.component_id }}
          BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
        run: |
          set -euo pipefail

          case "${COMPONENT_ID}" in
            backend)
              repository="${BACKEND_REPOSITORY}"
              ;;
            frontend)
              repository="${FRONTEND_REPOSITORY}"
              ;;
            *)
              echo "::error::Unknown component: ${COMPONENT_ID}"
              exit 1
              ;;
          esac

          image_tag="sha-${GITHUB_SHA}"
          image_name="${REGISTRY}/${repository}"
          image_ref="${image_name}:${image_tag}"

          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"

          echo "Component:  ${COMPONENT_ID}"
          echo "Repository: ${repository}"
          echo "Image name: ${image_name}"
          echo "Tag:        ${image_tag}"

      - name: Reject duplicate immutable release
        shell: bash
        env:
          REPOSITORY: ${{ steps.metadata.outputs.repository }}
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
        run: |
          set -euo pipefail

          if aws ecr describe-images \
            --repository-name "${REPOSITORY}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --region "${{ vars.AWS_REGION }}" \
            >/dev/null 2>&1; then

            echo "::error::Image ${REPOSITORY}:${IMAGE_TAG} already exists."
            echo "::error::Trusted build artifacts are immutable and will not be overwritten."
            exit 1
          fi

          echo "No existing immutable artifact found."

      - name: Build container image once
        shell: bash
        env:
          IMAGE_REF: ${{ steps.metadata.outputs.image_ref }}
        run: |
          set -euo pipefail

          docker build \
            --pull \
            --file "${{ matrix.dockerfile }}" \
            --tag "${IMAGE_REF}" \
            "${{ matrix.context }}"

      - name: Record local image identity
        id: local-image
        shell: bash
        env:
          IMAGE_REF: ${{ steps.metadata.outputs.image_ref }}
        run: |
          set -euo pipefail

          image_id="$(
            docker image inspect \
              "${IMAGE_REF}" \
              --format '{{.Id}}'
          )"

          echo "image_id=${image_id}" >> "$GITHUB_OUTPUT"
          echo "Local image ID: ${image_id}"

      - name: Scan exact built image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.metadata.outputs.image_ref }}
          version: v0.74.0
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "0"

      - name: Block critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.metadata.outputs.image_ref }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "1"
          skip-setup-trivy: true

      - name: Block fixable high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.metadata.outputs.image_ref }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true

      - name: Push approved image to Amazon ECR
        shell: bash
        env:
          IMAGE_REF: ${{ steps.metadata.outputs.image_ref }}
        run: |
          set -euo pipefail

          docker push "${IMAGE_REF}"

      - name: Resolve immutable ECR digest
        id: digest
        shell: bash
        env:
          REPOSITORY: ${{ steps.metadata.outputs.repository }}
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail

          digest="$(
            aws ecr describe-images \
              --repository-name "${REPOSITORY}" \
              --image-ids "imageTag=${IMAGE_TAG}" \
              --region "${{ vars.AWS_REGION }}" \
              --query 'imageDetails[0].imageDigest' \
              --output text
          )"

          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected ECR digest: ${digest}"
            exit 1
          fi

          digest_ref="${REGISTRY}/${REPOSITORY}@${digest}"

          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "digest_ref=${digest_ref}" >> "$GITHUB_OUTPUT"

          echo "ECR digest: ${digest}"

      - name: Verify published artifact
        shell: bash
        env:
          REPOSITORY: ${{ steps.metadata.outputs.repository }}
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
          EXPECTED_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail

          published_digest="$(
            aws ecr describe-images \
              --repository-name "${REPOSITORY}" \
              --image-ids "imageTag=${IMAGE_TAG}" \
              --region "${{ vars.AWS_REGION }}" \
              --query 'imageDetails[0].imageDigest' \
              --output text
          )"

          if [[ "${published_digest}" != "${EXPECTED_DIGEST}" ]]; then
            echo "::error::Published digest verification failed."
            exit 1
          fi

          echo "Published digest verified."

      - name: Publish trusted-build summary
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
          IMAGE_REF: ${{ steps.metadata.outputs.image_ref }}
          LOCAL_IMAGE_ID: ${{ steps.local-image.outputs.image_id }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          DIGEST_REF: ${{ steps.digest.outputs.digest_ref }}
          SPDX_SHA256: ${{ steps.sbom-hashes.outputs.spdx_sha256 }}
          CYCLONEDX_SHA256: ${{ steps.sbom-hashes.outputs.cyclonedx_sha256 }}
        run: |
          {
            echo "## ${COMPONENT} trusted artifact"
            echo
            echo "| Attribute | Value |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Tag | \`${IMAGE_TAG}\` |"
            echo "| Local image ID | \`${LOCAL_IMAGE_ID}\` |"
            echo "| ECR digest | \`${DIGEST}\` |"
            echo "| Immutable reference | \`${DIGEST_REF}\` |"
            echo "| SPDX SBOM | \`${COMPONENT_ID}.spdx.json\` |"
            echo "| SPDX SHA256 | \`${SPDX_SHA256}\` |"
            echo "| CycloneDX SBOM | \`${COMPONENT_ID}.cyclonedx.json\` |"
            echo "| CycloneDX SHA256 | \`${CYCLONEDX_SHA256}\` |"
            echo
            echo "The image was built once, scanned before publication, and pushed only after the security gate passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare SBOM workspace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p sbom

          echo "SBOM workspace prepared."

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.digest.outputs.digest_ref }}
          format: spdx-json
          output-file: sbom/${{ matrix.component_id }}.spdx.json
          artifact-name: sbom-${{ matrix.component_id }}-spdx
          syft-version: ${{ env.SYFT_VERSION }}

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.digest.outputs.digest_ref }}
          format: cyclonedx-json
          output-file: sbom/${{ matrix.component_id }}.cyclonedx.json
          artifact-name: sbom-${{ matrix.component_id }}-cyclonedx
          syft-version: ${{ env.SYFT_VERSION }}

      - name: Validate SPDX SBOM
        shell: bash
        env:
          SPDX_FILE: sbom/${{ matrix.component_id }}.spdx.json
        run: |
          set -euo pipefail

          jq -e '
            .spdxVersion != null
            and .SPDXID != null
            and (.packages | type == "array")
          ' "${SPDX_FILE}" >/dev/null

          package_count="$(
            jq '.packages | length' "${SPDX_FILE}"
          )"

          if [[ "${package_count}" -lt 1 ]]; then
            echo "::error::SPDX SBOM contains no packages."
            exit 1
          fi

          echo "SPDX package count: ${package_count}"

      - name: Validate CycloneDX SBOM
        shell: bash
        env:
          CYCLONEDX_FILE: sbom/${{ matrix.component_id }}.cyclonedx.json
        run: |
          set -euo pipefail

          jq -e '
            .bomFormat == "CycloneDX"
            and .specVersion != null
            and (.components | type == "array")
          ' "${CYCLONEDX_FILE}" >/dev/null

          component_count="$(
            jq '.components | length' "${CYCLONEDX_FILE}"
          )"

          if [[ "${component_count}" -lt 1 ]]; then
            echo "::error::CycloneDX SBOM contains no components."
            exit 1
          fi

          echo "CycloneDX component count: ${component_count}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Verify Cosign version
        shell: bash
        run: |
          set -euo pipefail
          cosign version

      - name: Attest SLSA build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.metadata.outputs.image_name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SPDX SBOM
        id: spdx-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.metadata.outputs.image_name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom/${{ matrix.component_id }}.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest CycloneDX SBOM
        id: cyclonedx-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.metadata.outputs.image_name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom/${{ matrix.component_id }}.cyclonedx.json
          push-to-registry: true
          create-storage-record: false

      - name: Keyless-sign trusted image
        shell: bash
        env:
          DIGEST_REF: ${{ steps.digest.outputs.digest_ref }}
        run: |
          set -euo pipefail

          cosign sign \
            --yes \
            "${DIGEST_REF}"

      - name: Collect attestation bundles
        shell: bash
        env:
          COMPONENT_ID: ${{ matrix.component_id }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SPDX_BUNDLE: ${{ steps.spdx-attestation.outputs.bundle-path }}
          CYCLONEDX_BUNDLE: ${{ steps.cyclonedx-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail

          mkdir -p attestations

          cp "${PROVENANCE_BUNDLE}" \
            "attestations/${COMPONENT_ID}.provenance.sigstore.json"

          cp "${SPDX_BUNDLE}" \
            "attestations/${COMPONENT_ID}.spdx-attestation.sigstore.json"

          cp "${CYCLONEDX_BUNDLE}" \
            "attestations/${COMPONENT_ID}.cyclonedx-attestation.sigstore.json"

      - name: Calculate attestation bundle hashes
        shell: bash
        run: |
          set -euo pipefail

          sha256sum attestations/*.json \
            | tee attestations/SHA256SUMS

      - name: Upload attestation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-attestations-${{ matrix.component_id }}-${{ github.sha }}
          path: |
            attestations/${{ matrix.component_id }}.provenance.sigstore.json
            attestations/${{ matrix.component_id }}.spdx-attestation.sigstore.json
            attestations/${{ matrix.component_id }}.cyclonedx-attestation.sigstore.json
            attestations/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Calculate SBOM integrity hashes
        id: sbom-hashes
        shell: bash
        env:
          COMPONENT_ID: ${{ matrix.component_id }}
        run: |
          set -euo pipefail

          spdx_file="sbom/${COMPONENT_ID}.spdx.json"
          cyclonedx_file="sbom/${COMPONENT_ID}.cyclonedx.json"

          spdx_sha256="$(
            sha256sum "${spdx_file}" | awk '{print $1}'
          )"

          cyclonedx_sha256="$(
            sha256sum "${cyclonedx_file}" | awk '{print $1}'
          )"

          echo "spdx_sha256=${spdx_sha256}" >> "$GITHUB_OUTPUT"
          echo "cyclonedx_sha256=${cyclonedx_sha256}" >> "$GITHUB_OUTPUT"

          echo "SPDX SHA256:      ${spdx_sha256}"
          echo "CycloneDX SHA256: ${cyclonedx_sha256}"

      - name: Create SBOM metadata record
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          COMPONENT_ID: ${{ matrix.component_id }}
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          DIGEST_REF: ${{ steps.digest.outputs.digest_ref }}
          SPDX_SHA256: ${{ steps.sbom-hashes.outputs.spdx_sha256 }}
          CYCLONEDX_SHA256: ${{ steps.sbom-hashes.outputs.cyclonedx_sha256 }}
        run: |
          set -euo pipefail

          jq -n \
            --arg component "${COMPONENT}" \
            --arg commit "${GITHUB_SHA}" \
            --arg image_tag "${IMAGE_TAG}" \
            --arg image_digest "${DIGEST}" \
            --arg image_ref "${DIGEST_REF}" \
            --arg syft_version "${SYFT_VERSION}" \
            --arg spdx_file "${COMPONENT_ID}.spdx.json" \
            --arg spdx_sha256 "${SPDX_SHA256}" \
            --arg cyclonedx_file "${COMPONENT_ID}.cyclonedx.json" \
            --arg cyclonedx_sha256 "${CYCLONEDX_SHA256}" \
            '{
              component: $component,
              source_commit: $commit,
              container: {
                tag: $image_tag,
                digest: $image_digest,
                immutable_reference: $image_ref
              },
              sbom_generator: {
                name: "Syft",
                version: $syft_version
              },
              sboms: {
                spdx: {
                  file: $spdx_file,
                  sha256: $spdx_sha256
                },
                cyclonedx: {
                  file: $cyclonedx_file,
                  sha256: $cyclonedx_sha256
                }
              }
            }' \
            > "sbom/${COMPONENT_ID}.sbom-metadata.json"

          jq . "sbom/${COMPONENT_ID}.sbom-metadata.json"

      - name: Upload SBOM bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-sbom-${{ matrix.component_id }}-${{ github.sha }}
          path: |
            sbom/${{ matrix.component_id }}.spdx.json
            sbom/${{ matrix.component_id }}.cyclonedx.json
            sbom/${{ matrix.component_id }}.sbom-metadata.json
          if-no-files-found: error
          retention-days: 30


  verify-trusted-artifact:
    name: Verify Trusted Artifact — ${{ matrix.component }}
    needs:
      - publish-image

    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write
      attestations: read

    strategy:
      fail-fast: false

      matrix:
        include:
          - component: Backend
            component_id: backend

          - component: Frontend
            component_id: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ARTIFACT_VERIFIER_ROLE_ARN }}
          role-session-name: stjp-verify-${{ github.run_id }}-${{ matrix.component_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Resolve trusted image digest
        id: artifact
        shell: bash
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          COMPONENT_ID: ${{ matrix.component_id }}
          BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
        run: |
          set -euo pipefail

          case "${COMPONENT_ID}" in
            backend)
              repository="${BACKEND_REPOSITORY}"
              ;;
            frontend)
              repository="${FRONTEND_REPOSITORY}"
              ;;
            *)
              echo "::error::Unknown component ${COMPONENT_ID}"
              exit 1
              ;;
          esac

          image_tag="sha-${GITHUB_SHA}"

          digest="$(
            aws ecr describe-images \
              --repository-name "${repository}" \
              --image-ids "imageTag=${image_tag}" \
              --region "${{ vars.AWS_REGION }}" \
              --query 'imageDetails[0].imageDigest' \
              --output text
          )"

          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Valid trusted image digest was not found."
            exit 1
          fi

          digest_ref="${REGISTRY}/${repository}@${digest}"

          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "digest_ref=${digest_ref}" >> "$GITHUB_OUTPUT"

          echo "Artifact: ${digest_ref}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.2"

      - name: Verify trusted artifact policy

        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST_REF: ${{ steps.artifact.outputs.digest_ref }}
        run: |
          scripts/security/verify-trusted-image.sh \
            "${DIGEST_REF}" \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_SHA}"

      - name: Create artifact verification record

        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          COMPONENT_ID: ${{ matrix.component_id }}
          DIGEST: ${{ steps.artifact.outputs.digest }}
          DIGEST_REF: ${{ steps.artifact.outputs.digest_ref }}
        run: |
          set -euo pipefail

          mkdir -p verification

          jq -n \
            --arg component "${COMPONENT}" \
            --arg source_repository "${GITHUB_REPOSITORY}" \
            --arg source_commit "${GITHUB_SHA}" \
            --arg source_ref "${GITHUB_REF}" \
            --arg image_digest "${DIGEST}" \
            --arg immutable_reference "${DIGEST_REF}" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            '{
              verification_status: "PASSED",
              component: $component,
              source: {
                repository: $source_repository,
                commit: $source_commit,
                ref: $source_ref
              },
              artifact: {
                digest: $image_digest,
                immutable_reference: $immutable_reference
              },
              policy: {
                cosign_signature: "verified",
                signer_identity: "verified",
                oidc_issuer: "verified",
                slsa_provenance: "verified",
                spdx_attestation: "verified",
                cyclonedx_attestation: "verified"
              },
              workflow: {
                name: $workflow,
                run_id: $run_id
              }
            }' \
            > "verification/${COMPONENT_ID}.verification.json"

          jq . \
            "verification/${COMPONENT_ID}.verification.json"

      - name: Upload verification record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-verification-${{ matrix.component_id }}-${{ github.sha }}
          path: |
            verification/${{ matrix.component_id }}.verification.json
            referrers.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish verification summary
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.artifact.outputs.digest }}
          DIGEST_REF: ${{ steps.artifact.outputs.digest_ref }}
        run: |
          {
            echo "## ${COMPONENT} artifact verification"
            echo
            echo "| Control | Result |"
            echo "|---|---|"
            echo "| Immutable digest | \`${DIGEST}\` |"
            echo "| Cosign signature | ✅ Verified |"
            echo "| GitHub Actions signer identity | ✅ Verified |"
            echo "| OIDC issuer | ✅ Verified |"
            echo "| SLSA provenance | ✅ Verified |"
            echo "| Source repository | ✅ ${GITHUB_REPOSITORY} |"
            echo "| Source commit | ✅ \`${GITHUB_SHA}\` |"
            echo "| Source ref | ✅ \`refs/heads/main\` |"
            echo "| SPDX SBOM attestation | ✅ Verified |"
            echo "| CycloneDX SBOM attestation | ✅ Verified |"
            echo
            echo "**Promotion status:** TRUSTED"
            echo
            echo "\`${DIGEST_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"


  trusted-artifact-gate:
    name: Trusted Artifact Gate

    needs:
      - verify-trusted-artifact

    if: always()

    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions: {}

    steps:
      - name: Enforce trusted artifact verification
        shell: bash
        env:
          VERIFICATION_RESULT: ${{ needs.verify-trusted-artifact.result }}
        run: |
          set -euo pipefail

          echo "Artifact verification: ${VERIFICATION_RESULT}"

          if [[ "${VERIFICATION_RESULT}" != "success" ]]; then
            echo "::error::Trusted artifact verification failed."
            echo "::error::Artifact is not eligible for promotion."
            exit 1
          fi

          echo "All trusted artifact verification controls passed."
          echo "Artifact is eligible for promotion."