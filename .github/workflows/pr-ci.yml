---
name: Pull Request CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.12.0"

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for hardcoded secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: codeql/javascript-typescript

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: application/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: application/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  frontend-tests:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: application/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: application/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend production bundle
        run: npm run build

  container-build:
    name: Container Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - backend-tests
      - frontend-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build backend container
        run: |
          docker build \
            --file application/backend/Dockerfile \
            --tag secure-travel-journal-backend:pr-${{ github.sha }} \
            application/backend

      - name: Build frontend container
        run: |
          docker build \
            --file application/frontend/Dockerfile \
            --tag secure-travel-journal-frontend:pr-${{ github.sha }} \
            application/frontend

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: always()

    needs:
      - gitleaks
      - codeql
      - backend-tests
      - frontend-tests
      - container-build

    steps:
      - name: Evaluate required jobs
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          CONTAINER_RESULT: ${{ needs.container-build.result }}
        run: |
          echo "Gitleaks scan:  ${GITLEAKS_RESULT}"
          echo "CodeQL analysis:  ${CODEQL_RESULT}"
          echo "Backend tests:  ${BACKEND_RESULT}"
          echo "Frontend checks: ${FRONTEND_RESULT}"
          echo "Container build: ${CONTAINER_RESULT}"

          if [[ "${GITLEAKS_RESULT}" != "success" ]]; then
            echo "::error::Gitleaks detected a potential hardcoded secret or failed to complete."
            exit 1
          fi

          if [[ "${CODEQL_RESULT}" != "success" ]]; then
            echo "::error::CodeQL analysis did not complete successfully."
            exit 1
          fi

          if [[ "${BACKEND_RESULT}" != "success" ]]; then
            echo "::error::Backend tests did not pass."
            exit 1
          fi

          if [[ "${FRONTEND_RESULT}" != "success" ]]; then
            echo "::error::Frontend tests or build did not pass."
            exit 1
          fi

          if [[ "${CONTAINER_RESULT}" != "success" ]]; then
            echo "::error::Container build validation did not pass."
            exit 1
          fi

          echo "All Phase 2.3 required checks passed."
