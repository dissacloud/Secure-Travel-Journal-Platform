---
name: Pull Request CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.12.0"
  PYTHON_VERSION: "3.12"
  CHECKOV_VERSION: "3.3.9"

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for hardcoded secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.7
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.7
        with:
          category: codeql/javascript-typescript

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml

  sca-audit:
    name: SCA Audit — ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: Backend
            directory: application/backend
            lockfile: application/backend/package-lock.json

          - component: Frontend
            directory: application/frontend
            lockfile: application/frontend/package-lock.json

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Audit dependency tree
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=high

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: application/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: application/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  frontend-tests:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: application/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: application/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend production bundle
        run: npm run build

  dockerfile-lint:
    name: Dockerfile Security — ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: Backend
            dockerfile: application/backend/Dockerfile

          - component: Frontend
            dockerfile: application/frontend/Dockerfile

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: .hadolint.yaml
          no-fail: false

  container-security:
    name: Container Security — ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - backend-tests
      - frontend-tests
      - dockerfile-lint

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: Backend
            id: backend
            context: application/backend
            dockerfile: application/backend/Dockerfile
            image: secure-travel-journal-backend

          - component: Frontend
            id: frontend
            context: application/frontend
            dockerfile: application/frontend/Dockerfile
            image: secure-travel-journal-frontend

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build container image
        run: |
          docker build \
            --file "${{ matrix.dockerfile }}" \
            --tag "${{ matrix.image }}:pr-${{ github.sha }}" \
            "${{ matrix.context }}"

      - name: Generate Trivy vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:pr-${{ github.sha }}
          version: v0.73.0
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: sarif
          output: trivy-${{ matrix.id }}.sarif
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Upload Trivy results to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-${{ matrix.id }}.sarif
          category: trivy/${{ matrix.id }}

      - name: Block critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:pr-${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "1"
          skip-setup-trivy: true

      - name: Block fixable high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:pr-${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true

  terraform-security:
    name: IaC Security — Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Checkov
        run: |
          python -m pip install \
            --disable-pip-version-check \
            "checkov==${CHECKOV_VERSION}"

          checkov --version

      - name: Detect Terraform files
        id: terraform-target
        shell: bash
        run: |
          if find infrastructure \
            -type f \
            -name '*.tf' \
            -print -quit | grep -q .; then

            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Terraform configuration detected."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Terraform configuration exists yet."
          fi

      - name: Generate Terraform security report
        if: steps.terraform-target.outputs.present == 'true'
        run: |
          checkov \
            --directory infrastructure \
            --framework terraform \
            --soft-fail \
            --output sarif \
            --output-file-path checkov-terraform.sarif

      - name: Validate Terraform SARIF
        if: steps.terraform-target.outputs.present == 'true'
        run: |
          test -s checkov-terraform.sarif
          jq empty checkov-terraform.sarif
          echo "Checkov SARIF is valid JSON."

      - name: Upload Terraform findings
        if: steps.terraform-target.outputs.present == 'true'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: checkov-terraform.sarif/results_sarif.sarif
          category: checkov/terraform

      - name: Enforce Terraform security policy
        if: steps.terraform-target.outputs.present == 'true'
        run: |
          checkov \
            --directory infrastructure \
            --framework terraform \
            --compact

  kubernetes-security:
    name: IaC Security — Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Checkov
        run: |
          python -m pip install \
            --disable-pip-version-check \
            "checkov==${CHECKOV_VERSION}"

          checkov --version

      - name: Detect Kubernetes manifests
        id: kubernetes-target
        shell: bash
        run: |
          if find platform/kubernetes \
            -type f \
            \( -name '*.yaml' -o -name '*.yml' \) \
            -print -quit | grep -q .; then

            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Kubernetes configuration detected."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Kubernetes manifests exist yet."
          fi

      - name: Generate Kubernetes security report
        if: steps.kubernetes-target.outputs.present == 'true'
        run: |
          checkov \
            --directory platform/kubernetes \
            --framework kubernetes \
            --soft-fail \
            --output sarif \
            > checkov-kubernetes.sarif

      - name: Upload Kubernetes findings
        if: steps.kubernetes-target.outputs.present == 'true'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: checkov-kubernetes.sarif
          category: checkov/kubernetes

      - name: Enforce Kubernetes security policy
        if: steps.kubernetes-target.outputs.present == 'true'
        run: |
          checkov \
            --directory platform/kubernetes \
            --framework kubernetes \
            --compact

  workflow-security:
    name: GitHub Actions Security Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify workflow security controls
        run: scripts/ci/verify-workflow-hardening.sh

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions: {}

    if: always()

    needs:
      - gitleaks
      - codeql
      - dependency-review
      - sca-audit
      - backend-tests
      - frontend-tests
      - dockerfile-lint
      - container-security
      - terraform-security
      - kubernetes-security
      - workflow-security

    steps:
      - name: Evaluate required jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          SCA_RESULT: ${{ needs.sca-audit.result }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          DOCKERFILE_RESULT: ${{ needs.dockerfile-lint.result }}
          CONTAINER_SECURITY_RESULT: ${{ needs.container-security.result }}
          TERRAFORM_SECURITY_RESULT: ${{ needs.terraform-security.result }}
          KUBERNETES_SECURITY_RESULT: ${{ needs.kubernetes-security.result }}
          WORKFLOW_SECURITY_RESULT: ${{ needs.workflow-security.result }}
        run: |
          set -euo pipefail

          echo "Gitleaks scan:  ${GITLEAKS_RESULT}"
          echo "CodeQL analysis:  ${CODEQL_RESULT}"
          echo "Dependency review:   ${DEPENDENCY_REVIEW_RESULT}"
          echo "SCA audit:           ${SCA_RESULT}"
          echo "Backend tests:  ${BACKEND_RESULT}"
          echo "Frontend checks: ${FRONTEND_RESULT}"
          echo "Dockerfile lint:     ${DOCKERFILE_RESULT}"
          echo "Container security:  ${CONTAINER_SECURITY_RESULT}"
          echo "Terraform security:  ${TERRAFORM_SECURITY_RESULT}"
          echo "Kubernetes security: ${KUBERNETES_SECURITY_RESULT}"
          echo "Workflow security:   ${WORKFLOW_SECURITY_RESULT}"

          if [[ "${GITLEAKS_RESULT}" != "success" ]]; then
            echo "::error::Gitleaks detected a potential hardcoded secret or failed to complete."
            exit 1
          fi

          if [[ "${CODEQL_RESULT}" != "success" ]]; then
            echo "::error::CodeQL analysis did not complete successfully."
            exit 1
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ "${DEPENDENCY_REVIEW_RESULT}" != "success" ]]; then
              echo "::error::Dependency Review must pass for pull requests."
              exit 1
            fi
          else
            if [[ "${DEPENDENCY_REVIEW_RESULT}" != "skipped" ]]; then
              echo "::error::Dependency Review returned an unexpected result for ${EVENT_NAME}."
              exit 1
            fi
          fi

          if [[ "${SCA_RESULT}" != "success" ]]; then
            echo "::error::The dependency vulnerability audit did not pass."
            exit 1
          fi

          if [[ "${BACKEND_RESULT}" != "success" ]]; then
            echo "::error::Backend tests did not pass."
            exit 1
          fi

          if [[ "${FRONTEND_RESULT}" != "success" ]]; then
            echo "::error::Frontend tests or build did not pass."
            exit 1
          fi

          if [[ "${DOCKERFILE_RESULT}" != "success" ]]; then
            echo "::error::Dockerfile security validation did not pass."
            exit 1
          fi

          if [[ "${CONTAINER_SECURITY_RESULT}" != "success" ]]; then
            echo "::error::Container image security validation did not pass."
            exit 1
          fi

          if [[ "${TERRAFORM_SECURITY_RESULT}" != "success" ]]; then
            echo "::error::Terraform security validation did not pass."
            exit 1
          fi

          if [[ "${KUBERNETES_SECURITY_RESULT}" != "success" ]]; then
            echo "::error::Kubernetes security validation did not pass."
            exit 1
          fi

          if [[ "${WORKFLOW_SECURITY_RESULT}" != "success" ]]; then
            echo "::error::GitHub Actions security policy did not pass."
            exit 1
          fi

          echo "All Phase 2 security controls passed."
